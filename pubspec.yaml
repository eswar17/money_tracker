name: money_tracker

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:

  flutter:
    sdk: flutter

  firebase_core: ^3.6.0

  cloud_firestore: ^5.4.4

  firebase_auth: ^5.3.1

  intl: ^0.20.2

  csv: ^5.1.1

  cupertino_icons: ^1.0.8

  month_year_picker: ^0.5.0+1

  package_info_plus: ^8.0.2

  dio: ^5.7.0

  path_provider: ^2.1.4
  fl_chart: ^0.68.0
  dropdown_button2: ^2.3.9

dev_dependencies:

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  flutter_launcher_icons: ^0.14.3

fonts:
  - family: NotoSans
    fonts:
      - asset: assets/fonts/NotoSans-Regular.ttf

flutter:

  uses-material-design: true

  assets:
    - assets/csv/transactions.csv

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"